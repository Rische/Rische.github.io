<!DOCTYPE html>
<html lang="fr">
	<head>
		<title>Gaétan Rische's Website</title>
		<meta charset="utf-8"/>
		<meta name="Gaétan Rische" content="Gaétan Rische's Website"/>
		<script>
		function Redirect(){
			var userLang = localStorage.getItem("lang");
			if(userLang === null){
				userLang = navigator.language || navigator.userLanguage;
				localStorage.setItem("lang", userLang);
			}
			if(userLang == "fr"){
				window.location.href = "Profile.html";
			}else{
				window.location.href = "Profile_en.html";
			}
		}
		</script>
	</head>
	<body class="body" onLoad="Redirect()">
	
	</body>
</html>
